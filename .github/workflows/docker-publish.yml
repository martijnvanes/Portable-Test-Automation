# Tests the service, then builds the Docker image and publishes it to GitHub Container Registry.
# The Synology (or any other Docker host) pulls ghcr.io/<owner>/portable-test-automation:latest.
name: Build and publish image

on:
  push:
    branches: [master]
    # Deployment files are used on the Synology and .claude only configures Claude Code;
    # neither changes the image
    paths-ignore: ['deploy/**', '.claude/**']
  # Pull requests only run the tests. There is deliberately no paths-ignore here: a required
  # status check that never runs would block a pull request that only touches deploy/ or .claude/
  pull_request:
    branches: [master]
  workflow_dispatch:

# A new push to a pull request cancels its superseded test run. Master runs are never cancelled,
# so an image build can't be stopped halfway
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # GHCR image names must be lowercase, so don't derive this from the repository name
  IMAGE: ghcr.io/${{ github.repository_owner }}/portable-test-automation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

  publish:
    needs: test
    # Only master builds and pushes an image, never a pull request
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # QEMU + Buildx let one runner build both amd64 (Intel/AMD Synology) and arm64 images
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
